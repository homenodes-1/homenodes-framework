<text x="396" y="428" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">The project owns and operates every node. Households provide space and power, and are reimbursed for electricity.</text>
<text x="396" y="449" font-size="13.5" font-weight="normal" fill="#5A6672" text-anchor="start">All hardware is removed and returned at the end of the study.</text>
